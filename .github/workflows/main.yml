<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#7c2d5c">
<title>ALL IN ONE GIFT ITEMS | Happiness delivered to your door</title>
<style>
:root{--brand:#7c2d5c;--brand2:#a83d72;--gold:#f2b84b;--bg:#fff9fb;--card:#fff;--text:#24151d;--muted:#75636c;--line:#eadde3;--ok:#128c4b;--shadow:0 10px 28px rgba(74,31,53,.11)}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;background:var(--bg);color:var(--text)}
button,input,textarea{font:inherit}button{cursor:pointer}.wrap{width:min(1120px,calc(100% - 28px));margin:auto}
header{background:linear-gradient(135deg,var(--brand),#4e1b3a);color:white;padding:22px 0 28px;box-shadow:var(--shadow)}
.top{display:flex;align-items:center;gap:13px}.logo{width:52px;height:52px;border-radius:17px;background:linear-gradient(145deg,var(--gold),#fff0b8);display:grid;place-items:center;font-size:27px;box-shadow:0 8px 22px #0002}.title h1{font-size:clamp(20px,6vw,31px);margin:0;letter-spacing:.3px}.title p{margin:4px 0 0;color:#f9dfea;font-size:14px}
.hero{padding:20px 0 8px}.hero-card{background:#fff;border:1px solid var(--line);border-radius:22px;padding:18px;box-shadow:var(--shadow);display:flex;gap:14px;align-items:center;justify-content:space-between}.hero-card b{font-size:18px}.hero-card small{display:block;color:var(--muted);margin-top:5px;line-height:1.5}.hero-badge{white-space:nowrap;background:#fff2d3;color:#7a5010;padding:9px 12px;border-radius:999px;font-weight:800;font-size:12px}
.filters{display:flex;gap:8px;overflow:auto;padding:13px 1px 17px;scrollbar-width:none}.filters::-webkit-scrollbar{display:none}.filter{border:1px solid var(--line);background:#fff;color:var(--text);padding:9px 14px;border-radius:999px;white-space:nowrap;font-weight:700}.filter.active{background:var(--brand);border-color:var(--brand);color:#fff}
.section-head{display:flex;align-items:end;justify-content:space-between;margin:6px 0 13px}.section-head h2{margin:0;font-size:22px}.section-head span{color:var(--muted);font-size:13px}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;padding-bottom:95px}.card{background:var(--card);border:1px solid var(--line);border-radius:18px;overflow:hidden;box-shadow:0 5px 18px #5b29420c;transition:.2s}.card:active{transform:scale(.985)}.pic{aspect-ratio:1/1;background:#f3e9ed;overflow:hidden;position:relative}.pic img{width:100%;height:100%;object-fit:cover;display:block}.cat{position:absolute;left:8px;top:8px;background:#fffffff0;color:var(--brand);border-radius:999px;padding:5px 8px;font-size:10px;font-weight:800}.info{padding:11px}.name{font-weight:800;font-size:14px;line-height:1.25;min-height:35px}.price{font-size:18px;font-weight:900;color:var(--brand);margin:7px 0 9px}.price small{font-size:11px;color:var(--muted);font-weight:600}.add{width:100%;border:0;border-radius:11px;background:var(--brand);color:#fff;padding:10px 8px;font-weight:800}.add:active{background:var(--brand2)}
.float{position:fixed;z-index:30;border:0;box-shadow:0 8px 25px #0003}.cart-float{right:18px;bottom:20px;width:60px;height:60px;border-radius:20px;background:var(--brand);color:#fff;font-size:25px}.count{position:absolute;right:-4px;top:-5px;min-width:23px;height:23px;padding:0 5px;border-radius:99px;background:var(--gold);color:#3d2500;font-size:12px;font-weight:900;display:grid;place-items:center;border:2px solid white}.wa{right:88px;bottom:25px;width:50px;height:50px;border-radius:50%;background:#25D366;color:#fff;text-decoration:none;display:grid;place-items:center;font-size:24px;box-shadow:0 8px 25px #0002}
.overlay{position:fixed;inset:0;background:#1d0c1599;z-index:50;opacity:0;pointer-events:none;transition:.2s}.overlay.show{opacity:1;pointer-events:auto}.sheet{position:absolute;right:0;bottom:0;width:min(100%,520px);height:min(91vh,800px);background:#fff;border-radius:24px 24px 0 0;transform:translateY(100%);transition:.28s;display:flex;flex-direction:column}.show .sheet{transform:none}.sheet-head{padding:17px 18px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}.sheet-head h3{margin:0}.x{border:0;background:#f6edf1;border-radius:50%;width:38px;height:38px;font-size:20px}.cart-list{padding:12px 16px;overflow:auto;flex:1}.empty{text-align:center;color:var(--muted);padding:50px 15px}.cart-item{display:grid;grid-template-columns:1fr auto;gap:8px;border-bottom:1px solid var(--line);padding:12px 0}.cart-item b{font-size:14px}.cart-item .sub{font-weight:900;color:var(--brand)}.qty{display:flex;align-items:center;gap:7px;margin-top:8px}.qty button{width:30px;height:30px;border:1px solid var(--line);background:#fff;border-radius:9px;font-weight:900}.remove{border:0;background:none;color:#b42318;padding:5px 0;font-size:12px}.cart-foot{border-top:1px solid var(--line);padding:15px 18px;background:#fff}.total{display:flex;justify-content:space-between;font-size:20px;font-weight:900;margin-bottom:12px}.checkout{width:100%;border:0;border-radius:13px;background:var(--brand);color:#fff;padding:13px;font-weight:900}
.checkout-view{display:none;padding:16px 18px;overflow:auto;flex:1}.checkout-view.show{display:block}.cart-view.hide{display:none}.field{margin-bottom:12px}.field label{display:block;font-size:12px;font-weight:800;margin-bottom:5px}.field input,.field textarea{width:100%;border:1px solid #d9cbd1;border-radius:11px;padding:11px;outline:none}.field input:focus,.field textarea:focus{border-color:var(--brand);box-shadow:0 0 0 3px #7c2d5c14}.order-summary{white-space:pre-wrap;background:#fff7fa;border:1px solid var(--line);border-radius:12px;padding:11px;font-size:12px;line-height:1.55;margin-bottom:12px}.submit{width:100%;border:0;border-radius:13px;background:var(--ok);color:#fff;padding:13px;font-weight:900}.back{border:0;background:none;color:var(--brand);font-weight:800;padding:0 0 12px}.notice{font-size:11px;color:var(--muted);line-height:1.5;margin-top:10px}.success{display:none;text-align:center;padding:45px 18px}.success.show{display:block}.success .tick{font-size:50px}.success a{display:inline-block;margin-top:15px;background:#25D366;color:#fff;text-decoration:none;padding:12px 16px;border-radius:12px;font-weight:900}
footer{padding:30px 0 110px;text-align:center;color:var(--muted);font-size:12px;line-height:1.7}
.toast{position:fixed;z-index:80;left:50%;bottom:92px;transform:translate(-50%,20px);background:#24151d;color:#fff;padding:10px 14px;border-radius:999px;font-size:13px;opacity:0;pointer-events:none;transition:.2s;white-space:nowrap}.toast.show{opacity:1;transform:translate(-50%,0)}
@media(min-width:700px){.grid{grid-template-columns:repeat(3,1fr);gap:18px}.sheet{top:0;bottom:0;height:100%;border-radius:24px 0 0 24px}.show .sheet{transform:none}.sheet{transform:translateX(100%)}}
@media(min-width:980px){.grid{grid-template-columns:repeat(4,1fr)}}
</style>
</head>
<body>
<header>
  <div class="wrap top">
    <div class="logo">🎁</div>
    <div class="title"><h1>ALL IN ONE GIFT ITEMS</h1><p>Happiness delivered to your door</p></div>
  </div>
</header>

<main class="wrap">
  <section class="hero">
    <div class="hero-card">
      <div><b>Gifts for every special moment ✨</b><small>Rakhi combos, customized gifts, photo frames & more.<br>📍 Shridungargarh</small></div>
      <div class="hero-badge">Order Online</div>
    </div>
  </section>

  <div class="filters" id="filters"></div>
  <div class="section-head"><h2>Our Products</h2><span id="shownCount"></span></div>
  <section class="grid" id="products"></section>
</main>

<a class="wa float" href="https://wa.me/919311071662?text=Hello%20ALL%20IN%20ONE%20GIFT%20ITEMS%2C%20I%20want%20to%20ask%20about%20your%20products." target="_blank" rel="noopener" aria-label="Chat on WhatsApp">☏</a>
<button class="cart-float float" id="cartBtn" aria-label="Open cart">🛒<span class="count" id="cartCount">0</span></button>

<div class="overlay" id="overlay">
  <div class="sheet" role="dialog" aria-modal="true" aria-label="Shopping cart">
    <div class="sheet-head"><h3 id="sheetTitle">Your Cart</h3><button class="x" id="closeBtn">×</button></div>
    <div class="cart-view" id="cartView" style="display:flex;flex-direction:column;min-height:0;flex:1">
      <div class="cart-list" id="cartList"></div>
      <div class="cart-foot"><div class="total"><span>Grand Total</span><span id="grandTotal">₹0</span></div><button class="checkout" id="checkoutBtn">Place Order</button></div>
    </div>
    <div class="checkout-view" id="checkoutView">
      <button class="back" id="backBtn">← Back to cart</button>
      <form id="orderForm" action="https://formspree.io/f/xkjwwlzg" method="POST">
        <div class="field"><label>Customer Name *</label><input name="Customer Name" autocomplete="name" required></div>
        <div class="field"><label>Phone Number *</label><input name="Phone Number" type="tel" inputmode="tel" autocomplete="tel" pattern="[0-9 +()-]{8,15}" required></div>
        <div class="field"><label>Delivery Address *</label><textarea name="Delivery Address" rows="3" autocomplete="street-address" required></textarea></div>
        <div class="field"><label>Special Instructions (optional)</label><textarea name="Special Instructions" rows="2" placeholder="Customization name, color, delivery note, etc."></textarea></div>
        <div class="order-summary" id="orderPreview"></div>
        <input type="hidden" name="Order Summary" id="orderSummaryField">
        <input type="hidden" name="Grand Total" id="totalField">
        <input type="hidden" name="_subject" value="New Order - ALL IN ONE GIFT ITEMS">
        <button class="submit" id="submitBtn" type="submit">Send Order to Shop</button>
        <div class="notice">No online payment is collected. The shop will contact you to confirm product availability, final price, customization, delivery and payment.</div>
      </form>
    </div>
    <div class="success" id="successView">
      <div class="tick">✅</div><h2>Order placed!</h2>
      <p>ALL IN ONE GIFT ITEMS will contact you on WhatsApp/phone to confirm your order.</p>
      <a href="https://wa.me/919311071662?text=Hello%2C%20I%20have%20just%20placed%20an%20order%20on%20your%20website." target="_blank" rel="noopener">Chat on WhatsApp</a>
    </div>
  </div>
</div>
<div class="toast" id="toast">Added to cart</div>

<footer>
  <div class="wrap">ALL IN ONE GIFT ITEMS • Shridungargarh<br>WhatsApp: 9311071662 • Email: rajeshsarswat2005@gmail.com<br>Order collection website — no online payment processing.</div>
</footer>

<script>
const products=[
{id:1,name:"Rakhi Combo 5",price:600,category:"Rakhi",img:"https://i.ibb.co/WWHrPwpJ/IMG-20260804-WA0026.jpg"},
{id:2,name:"Rakhi",price:150,category:"Rakhi",img:"https://i.ibb.co/CKPLCwgS/IMG-20260804-WA0025.jpg"},
{id:3,name:"Rakhi Full Combo",price:400,category:"Rakhi",img:"https://i.ibb.co/QjNxqJPM/IMG-20260804-WA0017.jpg"},
{id:4,name:"Mini Cup Hamper",price:700,category:"Gift Combos",img:"https://i.ibb.co/ds7Gr9ds/IMG-20260804-WA0003.jpg"},
{id:5,name:"Wallet & Belt Combo",price:650,category:"Men Gifts",img:"https://i.ibb.co/cc7p2CfG/IMG-20260804-WA0004.jpg"},
{id:6,name:"Customized Cup",price:600,category:"Customized",img:"https://i.ibb.co/5gj4BTKk/1785899459623.jpg"},
{id:7,name:"Photo Frame (All Sizes)",price:200,maxPrice:5000,category:"Photo Frames",img:"https://i.ibb.co/xSzX5JqK/IMG-20250903-WA0009.jpg"},
{id:8,name:"Personalized Gift Mug",price:600,category:"Customized",img:"https://i.ibb.co/5gj4BTKk/1785899459623.jpg"},
{id:9,name:"Rakhi Gift Hamper",price:700,category:"Gift Combos",img:"https://i.ibb.co/ds7Gr9ds/IMG-20260804-WA0003.jpg"},
{id:10,name:"Men's Gift Combo",price:650,category:"Men Gifts",img:"https://i.ibb.co/cc7p2CfG/IMG-20260804-WA0004.jpg"}
];
const fallback='data:image/svg+xml;charset=UTF-8,'+encodeURIComponent(`<svg xmlns="http://www.w3.org/2000/svg" width="600" height="600"><rect width="100%" height="100%" fill="#f6e9ef"/><text x="50%" y="46%" text-anchor="middle" font-size="70">🎁</text><text x="50%" y="59%" text-anchor="middle" font-family="Arial" font-size="24" fill="#7c2d5c">ALL IN ONE GIFT ITEMS</text></svg>`);
let cart=JSON.parse(localStorage.getItem('aioGiftCart')||'{}');
let current='All';
const el=id=>document.getElementById(id), money=n=>'₹'+Number(n).toLocaleString('en-IN');
function save(){localStorage.setItem('aioGiftCart',JSON.stringify(cart));updateCount()}
function updateCount(){el('cartCount').textContent=Object.values(cart).reduce((s,q)=>s+q,0)}
function renderFilters(){
 const cats=['All',...new Set(products.map(p=>p.category))];
 el('filters').innerHTML=cats.map(c=>`<button class="filter ${c===current?'active':''}" data-cat="${c}">${c}</button>`).join('');
 document.querySelectorAll('.filter').forEach(b=>b.onclick=()=>{current=b.dataset.cat;renderFilters();renderProducts()})
}
function renderProducts(){
 const list=current==='All'?products:products.filter(p=>p.category===current);
 el('shownCount').textContent=list.length+' items';
 el('products').innerHTML=list.map(p=>`<article class="card">
 <div class="pic"><img loading="lazy" src="${p.img}" alt="${p.name} from ALL IN ONE GIFT ITEMS" onerror="this.onerror=null;this.src='${fallback}'"><span class="cat">${p.category}</span></div>
 <div class="info"><div class="name">${p.name}</div><div class="price">${p.maxPrice?money(p.price)+' – '+money(p.maxPrice):money(p.price)} ${p.maxPrice?'<small>depending on size</small>':''}</div><button class="add" data-id="${p.id}">Add to Cart</button></div></article>`).join('');
 document.querySelectorAll('.add').forEach(b=>b.onclick=()=>add(+b.dataset.id))
}
function add(id){cart[id]=(cart[id]||0)+1;save();toast();bump()}
function bump(){el('cartBtn').animate([{transform:'scale(1)'},{transform:'scale(1.16)'},{transform:'scale(1)'}],{duration:260})}
function toast(){el('toast').classList.add('show');setTimeout(()=>el('toast').classList.remove('show'),1100)}
function cartData(){return Object.entries(cart).filter(([,q])=>q>0).map(([id,q])=>({p:products.find(x=>x.id==id),q}))}
function total(){return cartData().reduce((s,x)=>s+x.p.price*x.q,0)}
function renderCart(){
 const data=cartData();
 el('cartList').innerHTML=data.length?data.map(({p,q})=>`<div class="cart-item"><div><b>${p.name}</b><div class="qty"><button onclick="change(${p.id},-1)">−</button><span>${q}</span><button onclick="change(${p.id},1)">+</button></div><button class="remove" onclick="removeItem(${p.id})">Remove</button></div><div class="sub">${money(p.price*q)}</div></div>`).join(''):`<div class="empty"><div style="font-size:42px">🛒</div><h3>Your cart is empty</h3><p>Add a gift you love.</p></div>`;
 el('grandTotal').textContent=money(total());el('checkoutBtn').disabled=!data.length;el('checkoutBtn').style.opacity=data.length?1:.45
}
window.change=(id,d)=>{cart[id]=(cart[id]||0)+d;if(cart[id]<=0)delete cart[id];save();renderCart()}
window.removeItem=id=>{delete cart[id];save();renderCart()}
function openCart(){renderCart();showCartView();el('overlay').classList.add('show');document.body.style.overflow='hidden'}
function closeCart(){el('overlay').classList.remove('show');document.body.style.overflow=''}
function showCartView(){el('cartView').style.display='flex';el('checkoutView').classList.remove('show');el('successView').classList.remove('show');el('sheetTitle').textContent='Your Cart'}
function buildSummary(){
 const lines=cartData().map(({p,q},i)=>`${i+1}. ${p.name}\n   ${q} × ${money(p.price)} = ${money(q*p.price)}`);
 return `ORDER ITEMS\n\n${lines.join('\n\n')}\n\nGRAND TOTAL: ${money(total())}\n\nNote: Final pricing/availability will be confirmed by the shop.`;
}
function checkout(){
 if(!cartData().length)return;
 el('cartView').style.display='none';el('checkoutView').classList.add('show');el('sheetTitle').textContent='Checkout';
 const s=buildSummary();el('orderPreview').textContent=s;el('orderSummaryField').value=s;el('totalField').value=money(total())
}
el('cartBtn').onclick=openCart;el('closeBtn').onclick=closeCart;el('checkoutBtn').onclick=checkout;el('backBtn').onclick=showCartView;
el('overlay').onclick=e=>{if(e.target===el('overlay'))closeCart()}
el('orderForm').addEventListener('submit',async e=>{
 e.preventDefault();const btn=el('submitBtn');btn.disabled=true;btn.textContent='Sending...';
 try{
   el('orderSummaryField').value=buildSummary();el('totalField').value=money(total());
   const r=await fetch(e.target.action,{method:'POST',body:new FormData(e.target),headers:{Accept:'application/json'}});
   if(!r.ok)throw new Error('Submission failed');
   cart={};save();e.target.reset();el('checkoutView').classList.remove('show');el('successView').classList.add('show');el('sheetTitle').textContent='Thank You!'
 }catch(err){alert('Order could not be sent. Please check your internet connection or send the order on WhatsApp.');}
 finally{btn.disabled=false;btn.textContent='Send Order to Shop'}
});
renderFilters();renderProducts();updateCount();
</script>
</body>
</html>
